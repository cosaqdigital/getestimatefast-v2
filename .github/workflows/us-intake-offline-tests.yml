name: US GetEstimateFast lead intake (offline)
on:
  push:
    branches:
      - feat/us-persisted-leads-20261014
  pull_request:
    paths:
      - api/lead.js
      - assets/platform-forms.js
      - assets/service-landing.js
      - tests/us-durable-lead-intake.test.js
      - tests/us-legacy-intake-routing.test.js
      - index.html
      - for-professionals.html
      - assets/pro-landing.css
      - assets/platform.css
      - assets/marketplace-portal.js
      - tests/us-mvp-home-pro.test.js
      - admin.html
      - assets/admin.js
      - api/admin/overview.js
      - tests/us-admin-overview.test.js
      - contractor-portal.html
      - assets/contractor-portal.js
      - assets/contractor-ux.js
      - assets/contractor-ux.css
      - tests/us-professional-ux.test.js
      - tests/us-profile-origin-referrals.test.js
      - api/profile-request.js
      - api/_lib/profile-origin.js
      - api/_lib/public-profile-html.js
      - api/public-profile.js
      - api/contractor/origin-leads.js
      - api/contractor/opportunities.js
      - supabase/prepared-migrations/us-profile-origin-referrals.sql
      - .github/workflows/us-intake-offline-tests.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Synthetic API and routing tests
        run: node --test tests/us-durable-lead-intake.test.js tests/us-legacy-intake-routing.test.js tests/us-mvp-home-pro.test.js tests/us-admin-overview.test.js tests/us-professional-ux.test.js tests/us-profile-origin-referrals.test.js
