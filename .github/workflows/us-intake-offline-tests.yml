jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Synthetic API and routing tests
        run: node --test tests/us-durable-lead-intake.test.js tests/us-legacy-intake-routing.test.js tests/us-mvp-home-pro.test.js tests/us-admin-overview.test.js tests/us-professional-ux.test.js tests/us-profile-origin-referrals.test.js tests/us-referral-auto-pricing.test.js tests/us-admin-password-recovery.test.js tests/us-admin-recovery-ui.test.js tests/production-migration.test.js tests/stripe-live.test.js tests/review-email-flow.test.js tests/review-google-auth.test.js tests/production-release-safety.test.js tests/telnyx-us-provider.test.js tests/opportunity-sms-live-safety.test.js tests/telnyx-us-webhook.test.js tests/opportunity-filters.test.js tests/ten-dlc-compliance.test.js
