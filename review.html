<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Leave a customer review | GetEstimateFast</title><link rel="stylesheet" href="/assets/marketplace.css"></head><body><header class="topbar"><a href="/">GetEstimateFast</a><span>We Connect. You Decide.</span></header><main class="shell"><section class="panel"><p class="eyebrow">Customer feedback</p><h1>Tell us about your experience</h1><p>Use the invitation sent by your professional. Reviews are moderated before publication. Your email stays private. An external review is not a verified platform purchase.</p><form id="reviewForm"><label>Name to display<input name="display_name" minlength="2" maxlength="80" required></label><label>Email (private)<input name="email" type="email" required autocomplete="email"></label><label>Rating<select name="rating" required><option value="">Choose a rating</option><option value="5">5 — Excellent</option><option value="4">4 — Good</option><option value="3">3 — Average</option><option value="2">2 — Poor</option><option value="1">1 — Very poor</option></select></label><label>Your experience<textarea name="comment" minlength="10" maxlength="1500" rows="6" required></textarea></label><div class="honeypot" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div><label class="check"><input type="checkbox" name="consent" required>I confirm that this review describes my own experience and agree to publish my display name, rating and comment.</label><button id="submitReview">Submit for moderation</button></form><p id="reviewStatus" class="status" role="status" aria-live="polite"></p></section></main><script src="/assets/review-form.js" defer></script></body></html>
